name: Audited checks

# Additive-only: the existing webpack.yml is untouched.
# Scope: the browser-worker package only (vitest + typecheck + boot smoke).
# The worker/ package tests require workerd (Cloudflare Workers runtime)
# and are intentionally out of CI scope — run them locally.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-worker-tests:
    name: Browser worker vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: browser-worker/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Run vitest
        run: npm test

  browser-worker-smoke:
    name: Browser worker boot smoke
    runs-on: ubuntu-latest
    needs: browser-worker-tests
    defaults:
      run:
        working-directory: browser-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: browser-worker/package-lock.json
      - name: Install and build
        run: |
          npm ci
          npm run build
      - name: Boot and probe /health
        env:
          PORT: "8080"
        run: |
          node dist/index.js & SRV=$!
          for i in $(seq 1 20); do curl -sf localhost:8080/health && break; sleep 1; done
          curl -sf localhost:8080/health | grep -q '"ok": *true'
          kill $SRV

  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for committed secrets
        run: |
          set -e
          echo "Scanning for common secret patterns..."
          # --exclude keeps the scan from matching this very file's pattern.
          ! grep -rnE "AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{20,}|gho_[A-Za-z0-9]{20,}|BEGIN [A-Z ]*PRIVATE KEY|sk_(live|test)_[A-Za-z0-9]+|xox[bap]-[A-Za-z0-9-]+|-----BEGIN" \
            --include="*.py" --include="*.html" --include="*.txt" --include="*.md" --include="*.yml" --exclude="audited-checks.yml" .
          echo "No secrets found."
