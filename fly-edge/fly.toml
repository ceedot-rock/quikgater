# Quikgater Fly edge — SettleHop dry-run + public costs (no Cloudflare token).
# Default mock only. Live debit still needs Corey okay. PCC ≠ payment.
app = "quikgater-fly-edge"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "15s"
  timeout = "2s"
  grace_period = "5s"
  method = "GET"
  path = "/health"
