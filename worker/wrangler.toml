name = "fetchgate-worker"
main = "src/index.ts"
compatibility_date = "2024-09-25"
compatibility_flags = ["nodejs_compat"]

# Step 1 (Edge Safety): hard blocklist entries not covered by the static
# HARD_BLOCKLIST in src/blocklist.ts (e.g. dynamically-added paywalled domains).
[[kv_namespaces]]
binding = "BLOCKLIST_KV"
id = "6f1a95e9261b45aebc354f430eb74220"
preview_id = "ebb1398ad63b43b08f583bc1630a7a32"

# Step 1: cached robots.txt bodies, 24h TTL (see src/robots.ts).
[[kv_namespaces]]
binding = "ROBOTS_KV"
id = "ce011d7bffad49b2aca3de8624630f34"
preview_id = "882b58dad1c64c98b9b9c27f6b8b358f"

# Step 1: per (requester, domain) request counters for abuse detection.
# NOTE: KV is eventually-consistent, so this is an approximate limiter.
# Spec calls for >100 req/min/domain = 429; if that needs to be exact,
# swap this for a Durable Object counter later.
[[kv_namespaces]]
binding = "RATELIMIT_KV"
id = "d5f575e5963c47a58710134f0c072a62"
preview_id = "d1999e69a64945249f12b7ae27d88fea"

# Step 5 (not yet wired): dedup cache metadata (Layer 0).
[[kv_namespaces]]
binding = "CACHE_KV"
id = "c41490a701e24e8faa5c0ff1bdbbf8c7"
preview_id = "c040c6a15eb54e699f79cfc27516febc"

# Step 4: async render queue + consumer. Consumer runs in this same
# Worker script (see the `queue` export in src/index.ts) - no separate
# consumer Worker needed for this volume.
[[queues.producers]]
binding = "RENDER_QUEUE"
queue = "fetchgate-render-queue"

[[queues.consumers]]
queue = "fetchgate-render-queue"
max_batch_size = 10
max_retries = 3

# Step 4: job status storage, polled via GET /v1/job/{id}.
[[kv_namespaces]]
binding = "JOBS_KV"
id = "1b5e803b742843ff8a04b161165bcee6"
preview_id = "1406ec9760144a4c98958dc3dea6fd63"

# Step 5: Layer 0 dedup cache body storage (metadata is in CACHE_KV above).
# NOT YET CREATED against the real account - R2 needs to be enabled via
# the Cloudflare Dashboard first (one-time ToS acceptance, not API-able).
# Local `npm test`/`wrangler dev` work fine regardless (Miniflare
# simulates R2 locally); `wrangler deploy` will fail until this bucket
# actually exists.
[[r2_buckets]]
binding = "CACHE_R2"
bucket_name = "fetchgate-cache"

[vars]
# Base Sepolia address that receives x402 USDC test payments. Updated
# 2026-07-24 (previously 0x8542B90d11a5c21722a4A3B1047098a82203e288,
# set 2026-07-23). Format-validated (42 chars, 0x + 40 hex) but not
# on-chain verified - if this turns out to be wrong, payments will
# still verify fine (verification doesn't touch payTo's balance) but
# would fail at settlement time once settlePayment is ever wired in.
PAY_TO_ADDRESS = "0x64E31E05583F250644b76d0FFe12e129ea4DeeCe"

# fetchgate-browser-worker's live Fly.io URL. Deployed 2026-07-23.
BROWSER_WORKER_URL = "https://fetchgate-browser-worker.fly.dev"
